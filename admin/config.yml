backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "product_list"
        label: "Product List"
        file: "products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - label: "Product Name"
                name: "name"
                widget: "string"
              - label: "SKU"
                name: "sku"
                widget: "string"
                required: true
                hint: "Must be unique and match the sku in the Supabase product_variants table exactly — this is what links this product to its live price and stock."
              - label: "Category"
                name: "category"
                widget: "string"
                hint: "Used for tab filtering. e.g. cognac / whisky / champagne / wine / sake / baijiu / other"
              - label: "Category Label"
                name: "categoryLabel"
                widget: "string"
                hint: "Displayed on the card. e.g. Cognac, Whisky, Red Wine"
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Prices (SGD)"
                name: "prices"
                widget: "object"
                fields:
                  - label: "1 Bottle"
                    name: "bottle"
                    widget: "number"
                    required: false
                    value_type: "int"
                    hint: "Leave blank if not applicable"
                  - label: "1 Case"
                    name: "case"
                    widget: "number"
                    required: false
                    value_type: "int"
                    hint: "Leave blank if not applicable"
                  - label: "Case Size (bottles)"
                    name: "caseSize"
                    widget: "number"
                    required: false
                    value_type: "int"
                    hint: "How many bottles make up '1 Case'. Once a customer's cart quantity for this SKU reaches this number, the cart automatically switches to the case price. Currently set to 12 for every product as a placeholder — update per product once the real number is known."
                  - label: "5 Cases"
                    name: "fiveCases"
                    widget: "number"
                    required: false
                    value_type: "int"
                    hint: "Leave blank if not applicable"
                  - label: "5-Case Size (bottles)"
                    name: "fiveCaseSize"
                    widget: "number"
                    required: false
                    value_type: "int"
                    hint: "How many bottles make up '5 Cases' (usually 5x Case Size, but not assumed). Cart auto-switches to the 5-case price once quantity reaches this number. Leave blank until known."
