<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <nav class="policy-nav">

    <div class="policy-nav-right">
      <div class="nav-account" id="navAccount"></div>
      <!-- Wrapped so #langToggle itself is never a direct flex child of
           .policy-nav-right — flex items are unconditionally blockified,
           which sizes a single-line element from line-height instead of

           .nav-account's (also-shielded) trigger text. -->
      <span><a class="nav-lang" id="langToggle" href="#" onclick="toggleAddressesLanguage(); return false;">English</a></span>
    </div>
  </nav>

  <main class="policy-main">

    <div id="myAddressesRoot" class="orders-list"></div>

  <footer>

      <nav class="footer-links" aria-label="Policies">

        <a href="policies/age-restriction.html" data-i18n="footer-age">Responsible Drinking</a>
      </nav>

  <script src="addresses-i18n.js"></script>
  <script type="module" src="/assets/storefront.js" defer></script>
